# All tunables in one place (the "configurable blueprint" idea from the NeMo Agent Toolkit poster).
# app.config.get("section.key") reads this; edits take effect without restarting.

capture:
  source: webcam            # pi | webcam | upload
  pi_url: http://raspberrypi.local:8080/snapshot.jpg
  webcam_index: 2           # H+3 (Henry): on this Mac 0/1 are idle iPhone Continuity cams (black); 2 = built-in. Re-run `python -m capture.source --list` after mounting the phone/Pi
  stable_seconds: 1.0       # scene must be still this long before we analyse
  change_threshold: 0.02    # mean abs diff on 160x120 grayscale

page:
  output_long_side: 2200    # dewarped page height for portrait paper
  min_page_area_fraction: 0.25
  blur_threshold: 1500      # H+3 (Henry): T1 measures Laplacian variance near ink on normalized gray @1100px; sharp >= 1800, blur <= 1200
  glare_fraction_max: 0.04
  use_aruco_fallback: true

layout:
  method: classical         # classical | doctr
  min_line_height_px: 28
  context_lines: 1          # lines above/below included in context crops
  crossed_out_min_conf: 0.6

transcribe:
  model_env: SV_MODEL       # model name read from this env var
  max_parallel: 6
  agreement_threshold: 0.92 # normalized-similarity between the two readings to count as agreement
  low_confidence: 0.6
  reread_on_disagreement: true
  effort: medium            # low | medium | high  (T3)
  thinking: adaptive        # adaptive | between_tools  (T3)
  empty_ink_density: 0.004  # below this a crop is blank -> no model call  (T3)
  page_pass_skip_below: 2   # incremental updates touching <= N lines skip the whole-page pass  (T3)
  sdk_max_retries: 2

budget_ms:
  # H+2 (Henry): raised to what one Sonnet 5.5 round trip actually costs (4-9 s per call, measured by T3).
  snapshot_to_twin_first: 15000
  new_line_incremental: 8000
