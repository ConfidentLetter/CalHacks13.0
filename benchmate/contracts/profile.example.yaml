# knowledge/profiles/<part_id>.yaml — one file per component (the "blueprint" idea from the NeMo poster).
# T4 writes the files. T3 executes `checks`. T2 uses `footprint` to lay out pins.
# Checks are STRUCTURED (kind + args), not free text, so T3 can run them as code.
#
# Two profile types: role "mcu" (the board that supplies power and buses) and role "peripheral".

# ---------- example 1: peripheral ----------
part_id: bme280
role: peripheral
aliases: ["BME280", "BME 280", "GY-BME280", "GYBMEP"]
datasheet: knowledge/datasheets/bme280.pdf
interface: i2c
i2c_addresses: ["0x76", "0x77"]      # 0x76 when SDO -> GND, 0x77 when SDO -> VDDIO
supply:
  max_v: 3.6                          # VERIFY for your module: boards with an onboard regulator accept 5V
  datasheet_page: null                # page label as shown in a PDF viewer; T4 fills from search()
footprint:
  rows:                               # one entry per physical pin row; the user registers the FIRST pin of each row
    - pins: [VIN, GND, SCL, SDA]      # order as they appear along the row (VERIFY on your module's silkscreen)
      axis: number                    # pins run along the numbered axis (1..63) of the breadboard
checks:
  - id: supply_voltage
    kind: max_supply                  # every power source on net(VIN) must be <= supply.max_v
    pin: VIN
    severity: error
    search_query: "supply voltage VDD maximum operating"
    question: "Which power rail is the sensor's VIN wire connected to?"
  - id: ground
    kind: same_net                    # net(pin) must contain the MCU pin playing `target_role`
    pin: GND
    target_role: gnd
    severity: error
    search_query: "GND ground pin"
    question: "Is the sensor's GND connected to the board's ground?"
  - id: i2c_sda
    kind: same_net
    pin: SDA
    target_role: i2c_sda
    severity: error
    search_query: "I2C SDA serial data pin"
    question: "Which board pin is the sensor's SDA wire connected to?"
  - id: i2c_scl
    kind: same_net
    pin: SCL
    target_role: i2c_scl
    severity: error
    search_query: "I2C SCL serial clock pin"
    question: "Which board pin is the sensor's SCL wire connected to?"

---
# ---------- example 2: mcu ----------
part_id: esp32-devkitc
role: mcu
aliases: ["ESP32-WROOM-32", "ESP32 DevKitC", "ESP32-DEVKITC-32E", "ESP32 DEVKIT V1"]
datasheet: knowledge/datasheets/esp32-devkitc.pdf
roles:                                # role -> pin name on this board
  i2c_sda: GPIO21                     # Arduino-ESP32 default Wire pins
  i2c_scl: GPIO22
  gnd: GND
sources:                              # pins that supply power, with their voltage
  3V3: 3.3
  5V: 5.0
footprint:
  rows:                               # VERIFY pin order on your exact board; DevKit variants differ
    - pins: [3V3, EN, VP, VN, GPIO34, GPIO35, GPIO32, GPIO33, GPIO25, GPIO26, GPIO27, GPIO14, GPIO12, GND, GPIO13, SD2, SD3, CMD, 5V]
      axis: number
    - pins: [GND, GPIO23, GPIO22, TX, RX, GPIO21, GND, GPIO19, GPIO18, GPIO5, GPIO17, GPIO16, GPIO4, GPIO0, GPIO2, GPIO15, SD1, SD0, CLK]
      axis: number
checks: []
