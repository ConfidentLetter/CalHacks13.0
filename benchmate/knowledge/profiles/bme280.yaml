# knowledge/profiles/bme280.yaml — Bosch BME280 on a breakout board. Schema: contracts/profile.example.yaml
# T4 owns this file. Pages are PDF-viewer labels of knowledge/datasheets/bme280.pdf (BST-BME280-DS001-23).
# STATUS: pin order of the breakout (footprint.rows) and supply.max_v are DRAFT until Henry's module photos
# arrive (Step 2). The datasheet facts (voltages, address, pages) are verified against the PDF.
part_id: bme280
role: peripheral
aliases: ["BME280", "BME 280", "GY-BME280", "GYBMEP", "BME280 sensor", "GY-BME/P", "BMP280"]
datasheet: knowledge/datasheets/bme280.pdf
interface: i2c
i2c_addresses: ["0x76", "0x77"]      # 0x76 when SDO -> GND, 0x77 when SDO -> VDDIO (p32, section 6.2)
i2c_address_page: "32"
supply:
  max_v: 3.6                          # operating max for VDD and VDDIO, Table 1 (p8). Bare sensor is 3.3 V-only.
  datasheet_page: "8"                 # Table 1: Electrical parameter specification, Supply Voltage VDD 1.71..3.6 V
  absolute_max_v: 4.25                # Table 5: Absolute maximum ratings, "Voltage at any supply pin" -0.3..4.25 V
  absolute_max_page: "13"             # the "will it break" number; 5 V exceeds even this
footprint:
  rows:
    - pins: [VIN, GND, SCL, SDA]      # GY-BME280 4-pin breakout order (VERIFY on the borrowed module's silkscreen)
      axis: number
checks:
  - id: supply_voltage
    kind: max_supply                  # every power source on net(VIN) must be <= supply.max_v
    pin: VIN
    severity: error
    search_query: "Supply Voltage VDD 1.71 3.6 V electrical parameter specification"
    datasheet_page: "8"
    question: "Which power rail is the sensor's VIN wire connected to?"
  - id: ground
    kind: same_net                    # net(pin) must contain the MCU pin playing `target_role`
    pin: GND
    target_role: gnd
    severity: error
    search_query: "pin-out GND ground pin"
    datasheet_page: "38"
    question: "Is the sensor's GND connected to the board's ground?"
  - id: i2c_sda
    kind: same_net
    pin: SDA
    target_role: i2c_sda
    severity: error
    search_query: "I2C interface uses the following pins SDI data SDA"
    datasheet_page: "33"                # "The I2C interface uses the following pins: SCK: serial clock (SCL), SDI: data (SDA)"
    question: "Which board pin is the sensor's SDA wire connected to?"
  - id: i2c_scl
    kind: same_net
    pin: SCL
    target_role: i2c_scl
    severity: error
    search_query: "I2C interface uses the following pins SCK serial clock SCL"
    datasheet_page: "33"
    question: "Which board pin is the sensor's SCL wire connected to?"
