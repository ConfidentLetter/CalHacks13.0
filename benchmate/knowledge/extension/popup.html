<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BenchMate Study Mode</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 14px; width: 280px; color: #1b1b1b; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #c7c7cc; border-radius: 24px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #2f9e44; }
  input:checked + .slider:before { transform: translateX(20px); }
  .status { font-size: 12px; color: #555; }
  .privacy { margin-top: 10px; padding: 8px; background: #f3f4f6; border-radius: 6px; font-size: 12px; color: #333; }
  a { color: #1d4ed8; }
</style>
</head>
<body>
  <h1>BenchMate Study Mode</h1>
  <div class="row">
    <span>Study mode</span>
    <label class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></label>
  </div>
  <div class="status" id="status">Off. Nothing is recorded.</div>
  <div class="privacy">
    <strong>Privacy:</strong> when on, after 30 s on an allow-listed page, this extension sends the page URL, its visible
    text and the time you spent to <code>localhost:8000</code> on this computer only. Nothing leaves your machine.
  </div>
  <div class="row"><a href="#" id="options">Allow-listed sites…</a></div>
  <script src="popup.js"></script>
</body>
</html>
